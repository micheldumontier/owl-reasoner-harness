# Pinned reasoners, per platform, with checksums.
#
# WHY A LOCKFILE. Reproducibility here rests on knowing exactly which binary produced
# a number. The repo used to carry binaries in bin/ instead -- ~1 GB of ELF x86-64
# that a clone on macOS or ARM cannot execute, and a macOS build committed there
# failed on Linux with "Exec format error". Pinning by URL + sha256 gives the same
# guarantee, works on every platform, and redistributes nothing.
#
# FORMAT: name<TAB>platform<TAB>version<TAB>sha256<TAB>url
#   platform is "<os>-<arch>", or "any" for platform-independent artifacts.
#   setup.sh fetches only rows matching the host, and VERIFIES the sha256 before use.
#
# CHANGING A PIN CHANGES YOUR RESULTS. A different robot.jar bundles different
# HermiT/ELK/JFact versions; a different Konclude is a different reasoner. Bump a row
# deliberately, and re-baseline anything you cite.

