[package]
name = "owl-corpus-harness"
version = "0.1.0"
edition = "2021"
description = "Reasoner-agnostic corpus measurement harness: fingerprint, run, report, compare"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
debug = 1
